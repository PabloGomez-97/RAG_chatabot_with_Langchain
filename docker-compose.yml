version: '3.8'

services:
  chatbot:
    build: .
    ports:
      - "8501:8501"
    container_name: rag-chatbot
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    env_file:
      - .env
    volumes:
      - ./data:/app/data  # Monta la carpeta data para persistir archivos
    restart: unless-stopped