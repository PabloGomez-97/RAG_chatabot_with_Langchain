version: '3.8'

services:
  chatbot:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    container_name: tarifas-chatbot
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    env_file:
      - .env
    volumes:
      - ./data:/app/data  # Persistir datos
      - chatbot_data:/app/data/vector_stores  # Volume para bases de datos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"

volumes:
  chatbot_data:
    driver: local